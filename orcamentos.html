<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Orçamentos · MobiLine</title>
<link rel="icon" href="assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
<style>
  .item-row { display:grid; grid-template-columns: 2fr 0.7fr 1fr auto; gap:8px; align-items:center; margin-bottom:8px; }
  .item-row input { padding:9px 10px; border-radius:8px; border:1px solid var(--border-color); font-size:13px; }
  .remove-item { background:none; border:none; color:var(--danger); cursor:pointer; font-size:16px; }
</style>
</head>
<body data-page="orcamentos">

<div class="app-shell">
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main-area">
    <header class="topbar" id="topbarMount"></header>

    <main class="content">
      <div class="content-header">
        <div>
          <h1>Orçamentos</h1>
          <p>Crie e acompanhe propostas comerciais para seus clientes.</p>
        </div>
        <button class="btn btn-primary" id="btnNovoOrcamento"><i class="bi bi-plus-lg"></i> Novo orçamento</button>
      </div>

      <div class="card">
        <div class="card-pad" style="padding-bottom:0;">
          <div class="toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="Pesquisar por cliente ou projeto..."></div>
            <select class="filter-select" id="statusFilter">
              <option value="">Todos os status</option>
              <option>Rascunho</option><option>Enviado</option><option>Aprovado</option><option>Recusado</option><option>Expirado</option>
            </select>
            <span class="cell-muted" id="countLabel" style="margin-left:auto;"></span>
          </div>
        </div>
        <div class="table-wrap">
          <table class="mobi-table">
            <thead><tr><th>Cliente</th><th>Projeto</th><th>Valor</th><th>Validade</th><th>Status</th><th></th></tr></thead>
            <tbody id="orcamentosBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<div class="modal-overlay" id="modalOrcamento">
  <div class="modal-box modal-wide">
    <div class="modal-header">
      <h3 id="modalOrcamentoTitle">Novo orçamento</h3>
      <button class="modal-close" data-close><i class="bi bi-x-lg"></i></button>
    </div>
    <form id="formOrcamento">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field"><label>Cliente *</label><select id="fCliente" required></select></div>
          <div class="form-field"><label>Nome do projeto *</label><input type="text" id="fProjetoNome" required></div>
          <div class="form-field full"><label>Descrição</label><textarea id="fDescricao"></textarea></div>
        </div>

        <div style="margin-top:16px;">
          <label style="font-size:12.5px; font-weight:600; color:var(--text-secondary);">Produtos / móveis</label>
          <div id="itensList" style="margin-top:8px;"></div>
          <button type="button" class="btn btn-outline btn-sm" id="btnAddItem"><i class="bi bi-plus-lg"></i> Adicionar item</button>
        </div>

        <div class="form-grid" style="margin-top:16px;">
          <div class="form-field"><label>Desconto (R$)</label><input type="number" min="0" step="0.01" id="fDesconto" value="0"></div>
          <div class="form-field"><label>Validade *</label><input type="date" id="fValidade" required></div>
          <div class="form-field"><label>Status</label>
            <select id="fStatus"><option>Rascunho</option><option>Enviado</option><option>Aprovado</option><option>Recusado</option><option>Expirado</option></select>
          </div>
          <div class="form-field"><label>Valor total</label><input type="text" id="fValorTotalDisplay" disabled></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar orçamento</button>
      </div>
    </form>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/orcamentos.js"></script>
</body>
</html>
