<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Clientes · MobiLine</title>
<link rel="icon" href="assets/logo-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@600;700;800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="assets/vendor/bootstrap-icons/bootstrap-icons.min.css">
<link rel="stylesheet" href="css/style.css">
</head>
<body data-page="clientes">

<div class="app-shell">
  <aside class="sidebar" id="sidebarMount"></aside>
  <div class="main-area">
    <header class="topbar" id="topbarMount"></header>

    <main class="content">
      <div class="content-header">
        <div>
          <h1>Clientes</h1>
          <p>Gerencie os clientes cadastrados na sua movelaria.</p>
        </div>
        <button class="btn btn-primary" id="btnNovoCliente"><i class="bi bi-plus-lg"></i> Novo cliente</button>
      </div>

      <div class="card">
        <div class="card-pad" style="padding-bottom:0;">
          <div class="toolbar">
            <div class="search-box"><i class="bi bi-search"></i><input type="text" id="searchInput" placeholder="Pesquisar por nome, e-mail ou telefone..."></div>
            <select class="filter-select" id="orderSelect">
              <option value="recentes">Mais recentes</option>
              <option value="nome">Nome (A-Z)</option>
            </select>
            <span class="cell-muted" id="countLabel" style="margin-left:auto;"></span>
          </div>
        </div>
        <div class="table-wrap">
          <table class="mobi-table">
            <thead>
              <tr><th>Cliente</th><th>Telefone</th><th>Projetos</th><th>Cadastro</th><th></th></tr>
            </thead>
            <tbody id="clientesBody"></tbody>
          </table>
        </div>
      </div>
    </main>
  </div>
</div>

<!-- Modal de cadastro/edição -->
<div class="modal-overlay" id="modalCliente">
  <div class="modal-box">
    <div class="modal-header">
      <h3 id="modalClienteTitle">Novo cliente</h3>
      <button class="modal-close" data-close><i class="bi bi-x-lg"></i></button>
    </div>
    <form id="formCliente">
      <div class="modal-body">
        <div class="form-grid">
          <div class="form-field full"><label>Nome completo *</label><input type="text" id="fNome" required></div>
          <div class="form-field"><label>Telefone *</label><input type="text" id="fTelefone" placeholder="(11) 90000-0000" required></div>
          <div class="form-field"><label>E-mail *</label><input type="email" id="fEmail" required></div>
          <div class="form-field full"><label>Endereço</label><input type="text" id="fEndereco"></div>
          <div class="form-field"><label>CPF/CNPJ (opcional)</label><input type="text" id="fDocumento"></div>
          <div class="form-field"><label>Data de cadastro</label><input type="date" id="fDataCadastro"></div>
          <div class="form-field full"><label>Observações</label><textarea id="fObservacoes"></textarea></div>
        </div>
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-outline" data-close>Cancelar</button>
        <button type="submit" class="btn btn-primary"><i class="bi bi-check-lg"></i> Salvar cliente</button>
      </div>
    </form>
  </div>
</div>

<!-- Modal de visualização -->
<div class="modal-overlay" id="modalVisualizar">
  <div class="modal-box modal-wide">
    <div class="modal-header">
      <h3 id="viewNome">Cliente</h3>
      <button class="modal-close" data-close><i class="bi bi-x-lg"></i></button>
    </div>
    <div class="modal-body" id="viewBody"></div>
    <div class="modal-footer">
      <button type="button" class="btn btn-outline" data-close>Fechar</button>
    </div>
  </div>
</div>

<script src="js/utils.js"></script>
<script src="js/data.js"></script>
<script src="js/layout.js"></script>
<script src="js/clientes.js"></script>
</body>
</html>
